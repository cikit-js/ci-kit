name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC 可信发布必需：npm 用这个令牌换取短期凭证，不需要任何长期 token
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # 版本只在 package.json#packageManager 里钉一次。
      # 这里再写 with.version 会构成双源，报
      # "Multiple versions of pnpm specified"。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # OIDC 可信发布要求 npm >= 11.5.1。
          # Node 22 自带 npm 10.x，publish 时会退回未认证（ENEEDAUTH），
          # 所以用 Node 24，下面再显式兜一次升级。
          node-version: 24
          cache: pnpm

      - name: ensure modern npm
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm -r run build

      - name: typecheck
        run: pnpm -r run typecheck

      - name: test
        run: pnpm test

      - name: publish packages
        # 不给 NODE_AUTH_TOKEN：让 npm CLI 走 OIDC 换取的短期凭证
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            echo "publish $name@$version"
            (cd "$dir" && npm publish --provenance)
          done
