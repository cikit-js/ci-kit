name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # npm Trusted Publisher (OIDC)。pnpm 检测到这个权限就用 id-token 换短期凭证；
    # 缺了它 pnpm 会退回读 .npmrc 的 _authToken，报
    # ERR_PNPM_ID_TOKEN_GITHUB_WORKFLOW_INCORRECT_PERMISSIONS。
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # 版本只在 package.json#packageManager 里钉一次。
      # 这里再写 with.version 会构成双源，报
      # "Multiple versions of pnpm specified"。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # pnpm 走 OIDC，不依赖 Node 自带的 npm 版本；
          # registry-url 让 pnpm 拿到正确的 registry 地址。
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # build 必须在 test 之前：包之间按包名互相 import（ai 引用
      # @cikit-js/http），而包入口指向 dist/index.mjs。dist 不进仓库，
      # 先跑测试会报 Failed to resolve entry for package。
      - name: verify
        run: |
          pnpm -r run typecheck
          pnpm -r run build
          pnpm test

      # 必须用 pnpm publish，不能用 npm publish：
      # npm 不认 workspace 协议，会把 "workspace:*" 原样写进 tarball，
      # 装上去的子依赖全部解析不到。pnpm publish 在打包时把它换成真实版本号。
      - name: publish packages
        run: pnpm -r publish --access public --no-git-checks
